# Render Blueprint — https://render.com/docs/blueprint-spec
# Python + uv.lock があるサービスでは Render が uv を用意するので、curl での再インストールはしない。
# シークレットは Dashboard の Environment で設定（sync: false）。

services:
  - type: web
    name: dkis-disc-bot
    runtime: python
    # Python 版は Blueprint では指定不可。ルートの .python-version（3.12）を参照する。
    plan: free
    region: singapore
    buildCommand: uv sync
    startCommand: uv run python main.py
    envVars:
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_CHANNEL_ID
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: KEEPALIVE_URL
        sync: false
      - key: DISCORD_BOOT_GREETING_PUSH_STORE_LIMIT
        sync: false
      - key: DISCORD_BOOT_GREETING_SKIP_STORED_IDS
        sync: false
