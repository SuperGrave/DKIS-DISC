# Render Blueprint — https://render.com/docs/blueprint-spec
# Python + uv.lock があるサービスでは Render が uv を用意するので、curl での再インストールはしない。
# シークレットは Dashboard の Environment で設定（sync: false）。

services:
  - type: web
    name: dkis-line-bot
    runtime: python
    # Python 版は Blueprint では指定不可。ルートの .python-version（3.12）を参照する。
    plan: free
    region: singapore
    buildCommand: uv sync
    # WEB_CONCURRENCY で増殖しないよう workers は 1 固定。I/O 待ちは threads で軽く並列化。
    startCommand: uv run gunicorn --workers 1 --threads 2 --bind 0.0.0.0:${PORT:-5000} main:app
    envVars:
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      # ワーカー起動時に定型文を Push する相手（任意・カンマ区切り LINE userId）
      - key: LINE_BOOT_GREETING_USER_IDS
        sync: false
