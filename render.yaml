# Render Blueprint — https://render.com/docs/blueprint-spec
# Python + uv.lock があるサービスでは Render が uv を用意するので、curl での再インストールはしない。
# シークレットは Dashboard の Environment で設定（sync: false）。

services:
  - type: web
    name: dkis-line-bot
    runtime: python
    # Python 版は Blueprint では指定不可。ルートの .python-version（3.12）を参照する。
    plan: free
    region: singapore
    buildCommand: uv sync
    startCommand: uv run gunicorn --bind 0.0.0.0:$PORT --workers 1 main:app
    envVars:
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
