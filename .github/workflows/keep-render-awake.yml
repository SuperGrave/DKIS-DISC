name: Keep Render Awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      KEEPALIVE_URL: ${{ vars.KEEPALIVE_URL || 'https://dkis-disc.onrender.com/' }}
    steps:
      - name: Ping Render service
        run: |
          echo "Pinging ${KEEPALIVE_URL}"
          curl --fail --silent --show-error --max-time 30 --retry 2 --retry-delay 10 "${KEEPALIVE_URL}"
