[project]
name = "dkis-disc"
version = "1.0.0"
description = "DKIS-DISC — Discord上で動作するDKIS互換の軽量AIボット（discord.py + OpenAI + ツール連携）。Web UI・音声・メディア再生なし。"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=48.0.0",
    # Discord bot
    "discord.py>=2.6.0",
    # AI / API クライアント
    "openai>=1.0.0",
    "python-dotenv>=1.2.2",
    # HTTP / 本文抽出（検索・サイト参照）
    "requests>=2.31.0",
    "supabase>=2.29.0",
    "trafilatura>=2.0.0",
]

# 開発用の依存関係（uv 最新形式）
[dependency-groups]
dev = [
    # 開発用の依存関係（必要に応じて追加）
    # "pytest>=7.0.0",
    # "ruff>=0.1.0",
]

[tool.uv]
# アプリケーションとして実行するため、パッケージ化は不要
package = false
