[project]
name = "dkis-line"
version = "0.3.0"
description = "DKIS-LINE - LINE Bot専用の軽量AIチャットアプリ"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Web フレームワーク
    "flask>=3.0.0",
    # AI / API クライアント
    "line-bot-sdk>=3.23.0",
    "openai>=1.0.0",
    "python-dotenv>=1.2.2",
    # HTTP / 本文抽出（検索・サイト参照）
    "requests>=2.31.0",
    "trafilatura>=2.0.0",
]

# 開発用の依存関係（uv 最新形式）
[dependency-groups]
dev = [
    # 開発用の依存関係（必要に応じて追加）
    # "pytest>=7.0.0",
    # "ruff>=0.1.0",
]

[tool.uv]
# アプリケーションとして実行するため、パッケージ化は不要
package = false
